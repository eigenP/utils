# .github/workflows/ci.yml

name: Python package CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip and install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install package and test dependencies with uv
      run: |
        uv pip install --system ".[single-cell,dev]"
        uv pip install --system pytest-playwright
        playwright install chromium --with-deps
      
    - name: Run tests with pytest
      run: pytest

  pyodide:
    # Runs the suite inside Pyodide, the WebAssembly runtime marimo uses for
    # browser notebooks. Keep the version in step with marimo's bundled Pyodide.
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build wheel
      run: |
        pip install uv
        uv build --wheel

    - name: Install Pyodide
      run: npm install --no-save --prefix tests/wasm pyodide@314.0.0

    - name: Run tests in Pyodide
      run: node tests/wasm/run_pyodide_tests.mjs
