# .github/workflows/ci.yml

name: Python package CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip and install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install package and test dependencies with uv
      run: |
        uv pip install --system ".[single-cell,dev]"
        uv pip install --system pytest-playwright
        playwright install chromium --with-deps

    # Datasets downloaded by tests (sc.datasets.pbmc3k -> data/pbmc3k_raw.h5ad in
    # scanpy's default datasetdir). Cached so CI does not depend on the hosting
    # server on every run. The cache is saved right after the download, not at the
    # end of the job: actions/cache only saves when the whole job succeeds.
    - name: Restore cached test datasets
      id: datasets
      uses: actions/cache/restore@v4
      with:
        path: data
        key: test-datasets-pbmc3k-v1

    - name: Download test datasets
      if: steps.datasets.outputs.cache-hit != 'true'
      run: |
        for attempt in 1 2 3; do
          python -c "import scanpy as sc; sc.datasets.pbmc3k()" && exit 0
          echo "Download attempt $attempt failed; retrying in $((attempt * 20)) s"
          rm -f data/pbmc3k_raw.h5ad
          sleep $((attempt * 20))
        done
        exit 1

    - name: Save test datasets to cache
      if: steps.datasets.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      # the four matrix jobs race to save the same key; losing the race is harmless
      continue-on-error: true
      with:
        path: data
        key: test-datasets-pbmc3k-v1

    - name: Run tests with pytest
      run: pytest

  oldest-deps:
    # The matrix above resolves the newest releases its Python allows (on
    # 3.12+: pandas 3, numpy >= 2.5; on 3.11 the anndata line still pulls
    # pandas 2.x, but that is incidental). Pinned environments (Colab,
    # institutional conda envs) still ship older lines, so test them on
    # purpose on the oldest supported Python. Raise these caps deliberately.
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install package with older dependency lines
      run: |
        pip install uv
        printf '%s\n' 'pandas<3' 'numpy<2.3' 'scipy<1.16' 'scikit-image<0.26' > "$RUNNER_TEMP/oldest.txt"
        uv pip install --system --constraint "$RUNNER_TEMP/oldest.txt" ".[single-cell,dev]"
        python -c "import numpy, pandas, scipy, skimage; print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'scipy', scipy.__version__, 'skimage', skimage.__version__)"

    - name: Run tests with pytest (browser tests run in the matrix job)
      run: pytest --ignore-glob='tests/test_frontend_*'

  pyodide:
    # Runs the suite inside Pyodide, the WebAssembly runtime marimo uses for
    # browser notebooks. Keep the version in step with marimo's bundled Pyodide.
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build wheel
      run: |
        pip install uv
        uv build --wheel

    - name: Install Pyodide
      run: npm install --no-save --prefix tests/wasm pyodide@314.0.0

    - name: Run tests in Pyodide
      run: node tests/wasm/run_pyodide_tests.mjs
