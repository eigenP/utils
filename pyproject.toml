[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenp-utils"
version = "0.0.2"
description = "Utilities for EigenP"
readme = "README.md"
authors = [
  { name = "Panos Oikonomou" }
]
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "matplotlib",
    "anywidget",
    "traitlets",
    "pandas",
    "tqdm",
    "numpy",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/eigenP/utils"
Issues = "https://github.com/eigenP/utils/issues"
Repository = "https://github.com/eigenP/utils.git"

[project.optional-dependencies]
plotting = [
    "plotly",
    "statannotations",
    # statannotations imports statsmodels lazily for multiple-comparison
    # corrections (add_stat_annotations defaults to Holm-Bonferroni)
    "statsmodels",
]
single-cell = [
    "pacmap>=0.7.3",
    "scanpy", "anndata",
    "esda",
    "libpysal",
    "triku",
    "leidenalg",
    "adjustText",
    # scanpy's default seurat_v3 HVG flavor (preprocess_subset, kknn_ingest)
    "scikit-misc",
]
# Bonsai cell-tree reconstruction (eigenp_utils.bonsai_tree). Bonsai itself is a
# script repository (github.com/dhdegroot/Bonsai-data-representation, CC BY-NC 4.0),
# not a pip package: clone it and set BONSAI_DIR. These are its run-time requirements
# beyond our core ones; independent of [single-cell]. For parallel runs also install
# OpenMPI + mpi4py.
bonsai = [
    "scikit-learn",
    "ruamel.yaml",
    "psutil",
]
# Parallel Bonsai runs (run_bonsai(n_procs=...)) without a system MPI: mpi4py plus the
# MPICH runtime wheels (which ship mpiexec). On clusters prefer mpi4py built against
# the site MPI instead.
bonsai-mpi = [
    "eigenp_utils[bonsai]",
    "mpi4py",
    "mpich; sys_platform != 'win32'",
]
dev = [
    "pytest>=7.0.0",
    # browser tests (tests/test_frontend_*.py); also run `playwright install chromium`
    "pytest-playwright",
    "marimo",
    "pot",
    "eigenp_utils[image-analysis,plotting,single-cell,bonsai]"
]
image-analysis = [
    "scikit-image",
    "xarray",
]
all = [
    "eigenp_utils[image-analysis,plotting,single-cell,bonsai,dev]"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eigenp_utils = [
  "tnia_plotting_anywidgets.js",
  "tnia_plotting_anywidgets.css",
  "iso_scatter.js",
  "scientific.mplstyle",
  "Inter-Regular.ttf"
]
